name: Build Android APK & Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-apk'
  cancel-in-progress: true

jobs:
  # 1. Build and Deploy Web Application to GitHub Pages
  build-and-deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        env:
          GITHUB_ACTIONS: 'true'
          BASE_PATH: '/TradingBot/'
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Build Android APK & Release
  build-android-apk:
    name: Build Android APK (Debug / Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor
        env:
          BASE_PATH: './'
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/TradePulse-Agent-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradePulse-Agent-APK
          path: release-apk/TradePulse-Agent-v1.0.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TradePulse Android App v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🚀 TradePulse AI Screen Analyzer APK
            - **Real-Time Cross-App Screen Capture**: MediaProjection Foreground Service
            - **Native Floating HUD Overlay**: Displays UP / DOWN / WAIT & Expiry over other Trading Apps
            - **AI Engine**: Gemini Vision & Anti-Stale Guard
            
            📲 ডাউনলোড করতে নিচের `TradePulse-Agent-v1.0.apk` ফাইলে ক্লিক করুন।
          draft: false
          prerelease: false
          files: |
            release-apk/TradePulse-Agent-v1.0.apk
